[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-categories"
version = "0.16.1"
description = "Category tree for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "categories"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floor: 0.26.0 emits docs/errors.json with the `owner` field the
    # committed artifact and its drift gate require.
    "stapel-core>=0.26.0,<1.0",
    # Floor: 0.5.0 brings the rule grammar + evaluator (parse_rules,
    # rule_warnings, evaluate_rules), the FeatureDef v2 fields this module
    # stores, validate_configs_structured(known_slugs=...) and
    # docs/feature-def.schema.json — the canon the ResolvedFeature contract
    # gate reads out of the installed package.
    # Cap: <0.7, not <1.0. Pre-1.0 house semver reads a MINOR as breaking, and
    # this line was the exception that proved it — stapel-attributes 0.6.0 adds
    # a thirteenth built-in type (`group`), which changes the discriminator
    # mapping this module emits into docs/schema.json, so a published release
    # of THAT package started failing tests/test_contract.py here
    # (`assert 13 == 12`) with nothing in this repository having changed.
    # 0.8.1's own publish run is where it surfaced, and 0.8.2 capped at <0.6 to
    # state the range it was tested against.
    #
    # 0.8.3 does the work instead: the contract triad is regenerated against
    # 0.6 and the composite crosses every boundary under test. So the FLOOR is
    # 0.6 too — the committed schema NAMES `group`, and on 0.5 the mapping
    # would advertise a type the installed registry does not have, which is the
    # same lie pointing the other way. A host on stapel-attributes 0.5.x stays
    # on stapel-categories 0.8.2 (which is what stapel-shop's `<0.6` and
    # stapel-classified's `>=0.5.1,<0.6` still resolve to).
    #
    # <0.8, not <0.7: stapel-attributes 0.7.0 snapshots the chosen options'
    # `label` copy into `SelectDao.labels`, index-aligned with `value`, so a
    # reader spells a stored select without fetching the category config —
    # closing a live classified deployment that printed storage slugs at
    # people. Held at <0.7 this line is the wall rather than the guard again:
    # pip answers ResolutionImpossible for anything installing this module
    # beside the fix.
    #
    # The FLOOR does NOT move with the cap this time, and the paragraph above
    # is exactly why the question had to be asked rather than assumed. 0.8.3
    # moved it because the committed docs/schema.json NAMES `group`, so on 0.5
    # the discriminator mapping this module emits advertised a type the
    # installed registry did not have. Nothing of 0.7.0 is named here:
    # `labels` is a field on a stored DAO, and this module emits no DAO at all
    # — docs/schema.json carries zero `*Dao*` components, because what
    # categories generates is the CONFIG side (FeatureConfig's discriminator
    # mapping and FeatureDto). The DAO is stapel-listings' half of the
    # boundary; the only `dto_to_dao` in this repository is a comment in
    # models.py naming the FeatureDef fields that have to cross it.
    #
    # Measured, not reasoned: `make contract-check` is clean against 0.7.0 —
    # the triad regenerates byte-identical — and the suite is green with
    # tests/test_contract.py still pinning thirteen registered types, because
    # 0.7.0 adds a field to an existing type rather than a fourteenth type.
    # So >=0.6 stays: 0.6 is what the committed schema requires, <0.8 is what
    # the fleet needs admitted, and a host on stapel-attributes 0.6.x takes
    # this release instead of being stranded on 0.8.3 for no gain.
    #
    # >=0.8,<0.9 as of stapel-categories 0.11.0, and this time the FLOOR does
    # move — the axis is not optional decoration. `Feature.coerce_visibility`
    # imports `stapel_attributes.visibility`, a module that does not exist
    # before 0.8.0, so every save() on 0.7 is an ImportError; and the committed
    # `schemas/functions/categories.features.json` REQUIRES `visibility` of a
    # resolved feature, which is a promise this module can only keep against a
    # FeatureDef that has the field. A host still on stapel-attributes 0.6/0.7
    # stays on stapel-categories 0.10.0, where nothing about disclosure exists
    # to be half-wired.
    #
    # >=0.8.3 as of stapel-categories 0.15.1: the floor moves for NOISE, not
    # for behaviour. `config["facet"]` works on any 0.8.x — `config` is opaque
    # and passes through untouched — but before 0.8.3 every feature carrying it
    # answers `validate-configs` with "Unknown config key(s) ignored: facet",
    # and that sentence is a lie which reads as an instruction to delete the
    # key. A documented opt-out the module's own validation endpoint calls dead
    # weight is worse than no opt-out, so this module refuses to run against
    # the version that says it.
    # <0.10 as of stapel-categories 0.16.1: stapel-attributes 0.9.0 changes one
    # rule semantic — `in` / `not_in` no longer match a controller that reads
    # EMPTY, so a `require when X not_in [...]` stops firing before anyone has
    # answered X. This module stores and validates rules; it does not evaluate
    # them for a form, and its whole suite is green on 0.9.0 unchanged. The
    # floor stays at 0.8.3 for the `facet` reason below.
    "stapel-attributes>=0.8.3,<0.10",
    "django-treenode>=0.23,<0.24",
    "drf-spectacular>=0.27",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-categories"
Repository = "https://github.com/usestapel/stapel-categories"
Documentation = "https://github.com/usestapel/stapel-categories#readme"
Changelog = "https://github.com/usestapel/stapel-categories/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-categories/issues"

[project.optional-dependencies]
all = []

[tool.setuptools]
package-dir = {"stapel_categories" = "."}
packages = [
    "stapel_categories",
    "stapel_categories.migrations",
    "stapel_categories.management",
    "stapel_categories.management.commands",
]

[tool.setuptools.package-data]
stapel_categories = ["py.typed", "migrations/*.py", "schemas/**/*.json", "docs/capabilities.json", "docs/llms.txt", "docs/schema.json", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
