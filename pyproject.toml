[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-categories"
version = "0.8.2"
description = "Category tree for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "categories"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floor: 0.26.0 emits docs/errors.json with the `owner` field the
    # committed artifact and its drift gate require.
    "stapel-core>=0.26.0,<1.0",
    # Floor: 0.5.0 brings the rule grammar + evaluator (parse_rules,
    # rule_warnings, evaluate_rules), the FeatureDef v2 fields this module
    # stores, validate_configs_structured(known_slugs=...) and
    # docs/feature-def.schema.json — the canon the ResolvedFeature contract
    # gate reads out of the installed package.
    # Cap: <0.6, not <1.0. Pre-1.0 house semver reads a MINOR as breaking, and
    # this line was the exception that proved it — stapel-attributes 0.6.0 adds
    # a thirteenth built-in type (`group`), which changes the discriminator
    # mapping this module emits into docs/schema.json, so a published release
    # of THAT package started failing tests/test_contract.py here
    # (`assert 13 == 12`) with nothing in this repository having changed.
    # 0.8.1's own publish run is where it surfaced.
    #
    # Lifting the cap to <0.7 is work rather than a number: regenerate the
    # contract triad against 0.6 and extend the ResolvedFeature gate for the
    # composite kind. Until then this module states the range it is actually
    # built and tested against, which is also the range stapel-shop (<0.6) and
    # stapel-classified (>=0.5.1,<0.6) install.
    "stapel-attributes>=0.5,<0.6",
    "django-treenode>=0.23,<0.24",
    "drf-spectacular>=0.27",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-categories"
Repository = "https://github.com/usestapel/stapel-categories"
Documentation = "https://github.com/usestapel/stapel-categories#readme"
Changelog = "https://github.com/usestapel/stapel-categories/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-categories/issues"

[project.optional-dependencies]
all = []

[tool.setuptools]
package-dir = {"stapel_categories" = "."}
packages = [
    "stapel_categories",
    "stapel_categories.migrations",
    "stapel_categories.management",
    "stapel_categories.management.commands",
]

[tool.setuptools.package-data]
stapel_categories = ["py.typed", "migrations/*.py", "schemas/**/*.json", "docs/capabilities.json", "docs/llms.txt", "docs/schema.json", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
